# Home Assistant app that serves the family docs (the docs/ folder in HA
# /config) as a website in the sidebar.
#
# Install: Settings > Apps > App store > ⋮ > Repositories > add this
# repository's URL, then install "Docs". For a local test, copy this
# folder to /addons/docs on the host and use "Check for updates".
#
# Why an app and not /config/www: files under www/ are served at /local/
# WITHOUT a login, and home docs can describe the home's security setup.
# Ingress puts the site behind the HA login, in the browser and in the
# Companion app. No port is published.
name: Docs
description: Family documentation (docs/ in /config), built with Hugo and Lotus Docs, shown behind the Home Assistant login.
version: "0.1.3"
slug: docs
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:book-open-variant
panel_title: Docs
# The docs are for every household account, admins or not.
panel_admin: false
map:
  - type: homeassistant_config
    read_only: true
